name: Laravel Rollback

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Target commit hash to rollback to'
        required: true
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: echo ${{ vars.GITHUBTOKEN }}
          fetch-depth: 0
          
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          
      - name: Validate target commit
        run: |
          if ! git cat-file -e ${{ inputs.target_commit }}; then
            echo "❌ Invalid commit hash: ${{ inputs.target_commit }}"
            exit 1
          fi
          echo "✅ Target commit is valid"
          
      - name: Create rollback branch
        run: |
          git checkout -b rollback-${{ github.run_number }}
          git reset --hard ${{ inputs.target_commit }}
          
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Generate key
        run: php artisan key:generate
        
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite
          
      - name: Run tests
        run: php artisan test
        
      - name: Check Laravel version
        run: php artisan --version
        
      - name: Create Rollback Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: rollback Laravel to stable version'
          title: '🔄 Emergency: Laravel Rollback'
          body: |
            ## Laravel Emergency Rollback
            
            This PR contains an emergency rollback of the Laravel framework.
            
            ### Rollback Details
            - **Target Commit:** ${{ inputs.target_commit }}
            - **Reason:** ${{ inputs.reason }}
            - **Triggered by:** @${{ github.actor }}
            - **Date:** ${{ github.run_id }}
            
            ### Verification
            - [x] Dependencies restored
            - [x] Tests passing ✅
            - [x] Laravel version confirmed
            
            **⚠️ URGENT: Please review and merge immediately**
            
          branch: rollback-${{ github.run_number }}
          delete-branch: true
