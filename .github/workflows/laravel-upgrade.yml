name: Laravel Auto Upgrade

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      has-updates: ${{ steps.check.outputs.has-updates }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        
      - name: Check for Laravel updates
        id: check
        run: |
          composer outdated laravel/framework --direct --format=json > outdated.json
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "[]" ]; then
            echo "has-updates=true" >> $GITHUB_OUTPUT
            echo "Laravel updates available"
          else
            echo "has-updates=false" >> $GITHUB_OUTPUT
            echo "No Laravel updates available"
          fi

  upgrade:
    needs: check-updates
    if: needs.check-updates.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: echo ${{ vars.GITHUBTOKEN }}
          
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        
      - name: Generate key
        run: php artisan key:generate
        
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite
          
      - name: Run pre-upgrade tests
        run: php artisan test
        
      - name: Update Laravel Framework
        run: |
          composer update laravel/framework --with-dependencies
          composer update --lock
          
      - name: Clear caches
        run: |
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          
      - name: Run migrations
        run: php artisan migrate --force
        
      - name: Run post-upgrade tests
        run: php artisan test
        
      - name: Check Laravel version
        run: php artisan --version
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: echo ${{ vars.GITHUBTOKEN }}
          commit-message: 'chore: auto-upgrade Laravel framework'
          title: '🚀 Auto: Laravel Framework Update'
          body: |
            ## Laravel Auto-Upgrade
            
            This PR contains an automated Laravel framework update.
            
            ### Changes
            - Updated Laravel framework to latest version
            - Updated related dependencies
            - All tests passing ✅
            
            ### Verification
            - [x] Pre-upgrade tests passed
            - [x] Dependencies updated successfully
            - [x] Post-upgrade tests passed
            - [x] Migrations completed
            
            **Created by:** Laravel Auto-Upgrade Bot
            **Date:** ${{ github.run_id }}
            
          branch: laravel-auto-upgrade-${{ github.run_number }}
          delete-branch: true
          
  notify:
    needs: [check-updates, upgrade]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify Success
        if: needs.upgrade.result == 'success'
        run: |
          echo "✅ Laravel auto-upgrade completed successfully"
          echo "Pull request created for review"
          
      - name: Notify Failure
        if: needs.upgrade.result == 'failure'
        run: |
          echo "❌ Laravel auto-upgrade failed"
          echo "Manual intervention required"
          
      - name: Notify No Updates
        if: needs.check-updates.outputs.has-updates == 'false'
        run: |
          echo "ℹ️ No Laravel updates available"
          echo "System is up to date"
